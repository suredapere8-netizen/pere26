<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Guerra de Comunidades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: mesa de operaciones — mapa real de España (o tu región a caballo) a la izquierda, panel de mando a la derecha */
:root{
  --bg:#171a13; --panel:#22271c; --panel2:#2b3123; --line:#3d4532;
  --fg:#ebe6d2; --muted:#a3a189; --brass:#e3a72f; --red:#d9472f; --green:#74b04c;
  --sea:#1c3340; --land2:#3a3a2c;
  --display:"Black Ops One","Impact","Arial Black",sans-serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55));pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
button{font-family:var(--body);font-size:16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.hud h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,28px);letter-spacing:.04em;margin:0;color:var(--brass);line-height:1}
.hud .me{display:flex;align-items:center;gap:8px}
.hud .me svg{width:40px;height:27px;border:1px solid #000;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.05}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stat.money b{color:var(--brass)}
.endturn{background:var(--red);color:#fff;border:0;padding:10px 18px;font-family:var(--display);font-size:17px;letter-spacing:.05em;box-shadow:0 3px 0 #7d2414}
.endturn:active{transform:translateY(2px);box-shadow:0 1px 0 #7d2414}
.views{display:flex;gap:4px;margin:10px 0}
.views button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px;font-family:var(--display);font-size:16px;letter-spacing:.06em}
.views button.on{background:var(--brass);color:#1a1405;border-color:var(--brass)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

.mapbox{background:rgba(34,39,28,.9);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mapsvg{width:100%;height:auto;display:block;border:1px solid #000;background:var(--sea)}
.mapbox{position:relative}.seasonfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}.seasonfx i{position:absolute;top:-30px;opacity:.75;animation:sfall linear infinite;font-style:normal;text-shadow:0 1px 2px rgba(0,0,0,.4)}
@keyframes sfall{to{transform:translate(60px,105vh) rotate(380deg)}}
.paper{background:#efe6cf;color:#1d1a14;padding:16px 18px;font-family:Georgia,'Times New Roman',serif;border:1px solid #b9ab88;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 40px rgba(120,90,40,.25)}
.paper .ph{text-align:center}.paper .ph small{display:block;font-size:12px;letter-spacing:.08em;color:#4a4030}.paper h1{font-family:'Black Ops One',Impact,serif;font-size:clamp(24px,5vw,38px);margin:4px 0;letter-spacing:.04em;border-top:3px double #1d1a14;border-bottom:3px double #1d1a14;padding:6px 0;color:#1d1a14}
.paper .hl{font-family:Georgia,serif;font-size:clamp(18px,3.4vw,24px);line-height:1.15;margin:6px 0;text-transform:uppercase;color:#1d1a14;text-wrap:balance}.paper .cols{column-count:2;column-gap:22px;column-rule:1px solid #c9b994;font-size:14px;line-height:1.4}.paper .cols p{margin:0 0 8px;break-inside:avoid}
@media (max-width:600px){.paper .cols{column-count:1}}.paper .btn{align-self:center}.evbox{border:2px solid #1d1a14;padding:10px;background:#f7f0dc;color:#1d1a14}.evbox p{margin:6px 0}.evres{font-weight:700;color:#1f5a20}.evres.bad{color:#8a1a10}.paper b{color:inherit}
.rwrap{position:relative;display:flex;justify-content:center;margin:6px 0}.rptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;color:#ffd479;text-shadow:0 2px 0 #000;z-index:2}#rwheel{filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.gcard,.gen,.skl,.bld{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);padding:8px;background:rgba(11,13,8,.35)}.gcard small,.gen small,.skl small,.bld small{display:block;color:var(--muted);font-size:12px}
.gi{font-size:26px;text-align:center}.gens,.skills,.blds{display:flex;flex-direction:column;gap:6px}.gen.on{border-color:var(--brass);background:rgba(227,167,47,.12)}.gen.lock{opacity:.5}.gl{color:var(--muted)}.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.diffs{display:flex;gap:6px;flex-wrap:wrap}.dip{display:flex;flex-direction:column;gap:6px;margin-top:6px}.dip b{color:var(--green)}.dip small{color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}.afl{display:flex;flex-direction:column;gap:2px;opacity:.28;filter:grayscale(1)}.afl.ok{opacity:1;filter:none}.afl svg{width:100%;height:auto;aspect-ratio:3/2;border:1px solid #000}.afl small{font-size:10px;line-height:1.1;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.fotos figure{margin:0;border:1px solid var(--line);background:#000}.fotos img{width:100%;display:block}.fotos figcaption{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px;font-size:12px;color:var(--muted)}.fotos a{color:var(--brass)}
.snapflash{position:fixed;inset:0;background:#fff;z-index:400;pointer-events:none;animation:snapf .45s ease-out forwards}@keyframes snapf{from{opacity:.85}to{opacity:0}}
.hatsw{display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#2a3038,#12161c)}
.dnbox{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}.dn{position:absolute;left:0;top:0;font-family:var(--display);font-size:20px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap}.dn.hd{color:#ffb040;font-size:24px}.dn.bs{color:#ff5a5a}
.bossbar{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));text-align:center;pointer-events:none;z-index:3}.bossbar b{font-family:var(--display);color:#ffd479;text-shadow:0 2px 0 #000;font-size:15px;letter-spacing:.04em}.bossbar .bb{height:10px;background:rgba(0,0,0,.6);border:1px solid #ffd479;margin-top:3px}.bossbar .bb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8a0a0a,#e8281c)}
.b5hud{position:absolute;left:16px;top:16px;pointer-events:none;z-index:3}#b5mm{display:block;border:2px solid rgba(227,167,47,.8);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.b5str{position:fixed;top:34%;left:50%;transform:translate(-50%,0);font-family:var(--display);font-size:clamp(20px,3vw,34px);color:#efe6cc;text-shadow:0 2px 0 #000;letter-spacing:.06em;text-align:center;pointer-events:none;z-index:6;white-space:nowrap;background:rgba(10,12,8,.55);border-top:2px solid var(--brass);border-bottom:2px solid var(--brass);padding:8px 22px}.b5str small{display:block;font-size:13px;color:#c8bfa6;letter-spacing:.12em}.b5str.on{animation:bnr 2.6s ease-out forwards}@keyframes bnr{0%{opacity:1;transform:translate(-50%,0) scale(1.25)}14%{transform:translate(-50%,0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-12px)}}
.nvg{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(circle,transparent 45%,rgba(0,20,0,.85) 100%)}
.medal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:1px solid var(--line)}.medal span{font-size:54px;animation:tin .5s}.medal.oro{border-color:#ffd479;box-shadow:0 0 24px rgba(255,212,121,.5)}.medal small{color:var(--muted)}
.compass[hidden],.b5str[hidden],.nvg[hidden],.rcount[hidden],.bossbar[hidden]{display:none!important}.compass{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(11,13,8,.82);border:1px solid var(--brass);padding:6px 14px;color:var(--fg);display:flex;gap:10px;align-items:center;font-size:15px;pointer-events:none;z-index:3}.compass .arr{display:inline-block;font-size:22px;color:var(--brass);transition:transform .1s linear}
.racehud{position:absolute;top:70px;right:16px;display:grid;grid-template-columns:repeat(2,auto);gap:6px 14px;background:rgba(11,13,8,.78);border:1px solid var(--line);padding:8px 12px;color:var(--fg);pointer-events:none}.racehud small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted)}.racehud b{font-family:var(--display);font-size:20px;color:var(--brass)}
.b3 canvas.racemm{position:absolute;left:16px;top:70px;width:160px;height:120px;border:1px solid var(--line);pointer-events:none}.b3 canvas#b5mm{width:170px;height:170px}.rcount{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(48px,10vw,110px);color:#ffd479;text-shadow:0 4px 0 #000;pointer-events:none}
.scoreb{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(11,13,8,.85);border:1px solid var(--brass);padding:6px 16px;color:var(--fg)}.scoreb b{font-family:var(--display);font-size:30px}.scoreb small{color:var(--brass);font-size:16px;min-width:34px;text-align:center}.scoreb .fl svg{width:36px;height:24px;display:block}
.pad3{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:repeat(3,56px);gap:6px}.pad3 button{height:56px;background:rgba(11,13,8,.75);border:1px solid var(--line);color:var(--fg);font-size:22px}

.mapwrap{position:relative}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:rgba(18,20,14,.96);border:1px solid var(--line);border-left:4px solid var(--brass);padding:8px 12px;color:var(--fg);box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .35s ease-out}
.toast.gold{border-color:var(--brass);background:linear-gradient(90deg,rgba(80,60,10,.95),rgba(18,20,14,.96))}.toast .ti{font-size:24px}.toast b{display:block}.toast small{color:var(--muted)}.toast.out{opacity:0;transform:translateY(-8px);transition:.5s}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.ksb{position:absolute;top:20%;left:50%;transform:translate(-50%,0);font-family:var(--display);font-size:clamp(18px,2.6vw,28px);color:#efe6cc;text-shadow:0 2px 0 #000;letter-spacing:.06em;text-transform:uppercase;text-align:center;pointer-events:none;opacity:0;z-index:5}
.ksb small{display:block;font-family:var(--ui,inherit);font-size:13px;color:#c8bfa6;letter-spacing:.12em}.ksb.on{animation:ksb2 2s ease-out forwards}@keyframes ksb2{0%{opacity:1;transform:translate(-50%,0) scale(1.15)}15%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,0) scale(1)}}
@keyframes ksa{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.12)}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.rankb,.chestb{background:rgba(11,13,8,.7);border:1px solid var(--brass);color:var(--brass);font-weight:700;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.chestb{animation:pulse2 1.4s infinite}@keyframes pulse2{50%{box-shadow:0 0 14px rgba(227,167,47,.8)}}
.xpb{display:inline-block;width:60px;height:6px;background:rgba(255,255,255,.15)}.xpb i{display:block;height:100%;background:var(--brass)}.xpb.big{display:block;width:100%;height:10px;margin:6px 0}
.rankc{border:1px solid var(--brass);background:linear-gradient(135deg,rgba(80,60,10,.35),transparent);padding:10px}.rankc .rk{font-family:var(--display);font-size:22px;color:var(--brass)}.rankc small{color:var(--muted)}
.mis{display:grid;grid-template-columns:1fr 70px 34px;gap:8px;align-items:center;border:1px solid var(--line);padding:6px 8px}.mis small{color:var(--muted);display:block}.mis.ok{border-color:var(--green);background:rgba(76,175,80,.1)}
.mp{height:7px;background:rgba(255,255,255,.12)}.mp i{display:block;height:100%;background:var(--brass)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}.ach{border:1px solid var(--line);padding:6px;opacity:.55;display:flex;flex-direction:column;gap:2px}.ach.ok{opacity:1;border-color:var(--brass)}.ach span{font-size:20px}.ach small{color:var(--muted);font-size:11px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}.dday{border:1px solid var(--line);padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:4px}.dday small{color:var(--muted)}.dday.got{opacity:.45}.dday.now{border-color:var(--brass);background:rgba(227,167,47,.18);animation:pulse2 1.2s infinite}
.chest{text-align:center;padding:10px}.cbox{font-size:96px;animation:shk .25s infinite}@keyframes shk{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
.crew{padding:16px;border:2px solid var(--line);margin-bottom:10px;animation:tin .4s}.crew .cr{font-size:70px}.crew.rar{border-color:#4a90e2;box-shadow:0 0 30px rgba(74,144,226,.5)}.crew.epi{border-color:#a855f7;box-shadow:0 0 34px rgba(168,85,247,.6)}.crew.leg{border-color:#ffd479;box-shadow:0 0 44px rgba(255,212,121,.8);background:rgba(80,60,10,.3)}.mapsvg.zoomable{height:min(76vh,820px);min-height:340px}.app.wide{grid-template-columns:minmax(0,1fr)}.app.wide .side{max-width:none}.mapwrap .mapsvg.zoomable{cursor:grab;touch-action:none}.mapwrap .mapsvg.zoomable:active{cursor:grabbing}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{min-width:36px;height:36px;padding:0 8px;background:rgba(11,13,8,.88);color:var(--fg);border:1px solid var(--line);font-weight:700;font-size:17px;cursor:pointer}
.mapctl button:hover{border-color:var(--brass);color:var(--brass)}
.faltan{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.fhead b{font-size:16px}
.prog{height:9px;background:rgba(255,255,255,.12);flex:1;min-width:120px}.prog div{height:100%;background:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}
.fchip{display:flex;align-items:center;gap:6px;background:rgba(11,13,8,.6);border:1px solid var(--line);color:var(--fg);padding:4px 8px;cursor:pointer;font:inherit;font-size:13px}
.fchip.atk{border-color:#d9472f}.fchip.on{border-color:#fff;background:rgba(255,255,255,.12)}.fchip small{color:var(--muted)}.fchip svg{flex:none;border:1px solid #000}
.reg{cursor:pointer;transition:filter .15s}
.reg:hover{filter:brightness(1.2) saturate(1.1)}
.pulse{animation:pulse 1.3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}

.rcard{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:10px}
.rcard .fl svg{width:96px;height:64px;display:block;border:1px solid #000}
.rcard h2{font-family:var(--display);font-weight:400;font-size:22px;margin:2px 0 6px;line-height:1}
.mini{display:flex;flex-wrap:wrap;gap:4px 12px}
.mini span{display:flex;align-items:center;gap:4px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.mini svg{width:22px;height:22px;color:var(--fg)}
.mini span.zero{opacity:.35}
.ad{display:flex;gap:6px}
.ad div{background:var(--bg);border:1px solid var(--line);padding:6px 10px;text-align:center;min-width:72px}
.ad b{display:block;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ad .a b{color:var(--red)} .ad .d b{color:#8fb8d8}
.ad.me .a b{color:var(--brass)}
.ad small{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.rcard .act{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center}
@media (max-width:620px){.rcard{grid-template-columns:72px minmax(0,1fr)}.rcard .fl svg{width:72px;height:48px}.rcard .ad{grid-column:1/-1}.rcard .act{grid-template-columns:1fr}}

.side{background:var(--panel);border:1px solid var(--line);min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;color:var(--muted);padding:11px 2px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:12.5px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--brass);background:var(--panel2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:4px;vertical-align:2px}
.pane{padding:14px;display:flex;flex-direction:column;gap:12px}
.pane h2,.box h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.05;text-wrap:balance}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.unit{background:var(--panel2);border:1px solid var(--line);padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.unit svg{width:28px;height:28px;color:var(--fg)}
.unit b{font-size:21px;font-variant-numeric:tabular-nums;line-height:1}
.unit span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn{background:var(--brass);color:#1a1405;border:0;padding:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;box-shadow:0 3px 0 #8a6214;width:100%}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #7d2414}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.note{font-size:14px;color:var(--muted);margin:0;line-height:1.35}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted);align-items:center}
.row b{color:var(--fg);font-variant-numeric:tabular-nums}
.chance{height:10px;background:var(--red);position:relative;border:1px solid #000;margin-top:4px}
.chance div{position:absolute;inset:0 auto 0 0;background:var(--brass)}

.shop{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:8px}
.item svg{width:34px;height:34px}
.item .t{font-weight:700;font-size:17px;line-height:1.1}
.item .d{font-size:13px;color:var(--muted);line-height:1.2}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:12px;height:5px;background:var(--line)} .pips i.on{background:var(--brass)}

       <div class="travel"><span>Viajar a</span>${Object.entries(TRAVEL).map(([k,v])=>`<button data-go="${k}">${v[0]}</button>`).join('')}</div></section>`;

    <text x="40" y="70" font-size="13">OCÉANO ATLÁNTICO</text><text x="330" y="30" font-size="13">MAR CANTÁBRICO</text><text x="730" y="470" font-size="13">MAR MEDITERRÁNEO</text></g>
  <rect x="14" y="590" width="212" height="110" fill="#1c3340" stroke="rgba(235,230,210,.4)" stroke-dasharray="5 4"/>
  ${regs}
  <path d="${GEO.borders}" fill="none" stroke="#0b0d08" stroke-width="1.8" stroke-linejoin="round" pointer-events="none"/>
  <path d="${GEO.coast}" fill="none" stroke="#0b0d08" stroke-width="2.6" stroke-linejoin="round" pointer-events="none"/>

  </svg>`;
}

      <p class="note" style="margin-top:6px">${!S.world&&RW[id]?`🗡️ Arma de la región: <b>${WPN[RW[id]].n}</b>${S.wpns&&S.wpns.includes(RW[id])?' (ya la tienes)':' · ¡conquístala para conseguirla!'}<br>`:''}${why||`Botín: ${R[id].v*2} € y +${R[id].v} € cada turno.${COAST.has(id)?' Tus barcos también atacan aquí.':' Sin costa: tus barcos no combaten aquí.'}`}${al.length?`<br><b style="color:var(--red)">⚠ Le ayudarán ${al.map(n=>R[n].n).join(' y ')} (+${ad} defensa)</b>`:''}</p></div>
    <div class="atkb"><button class="btn red" data-act="attack3d" data-id="${id}" ${why?'disabled':''}>${S.rebels&&S.rebels[id]?'¡SOFOCAR REBELIÓN!':'¡ATACAR EN 3D!'}</button><button class="btn ghost" data-act="attack" data-id="${id}" ${why?'disabled':''}>Ataque rápido</button>${dipHTML(id)}${GEO.world&&WORLD&&WORLD.n[id]?`<button class="btn ghost" data-flyto="${id}">✈️ Volar a ${R[id].n}</button>`:''}</div></div></div>`;

function shopHTML(keys){

  let h='<div class="shop">';
  for(const k of keys){
    if(k==='s')h+=`<div class="item">${ICON.s}<div><div class="t">Soldados · tienes ${S.army.s}</div><div class="d">${U.s.d}</div></div>
      <div class="buys"><button class="buy" data-buy="s" ${M<15?'disabled':''}>×1 · 15 €</button><button class="buy" data-buy="s10" ${M<140?'disabled':''}>×10 · 140 €</button></div></div>`;
    else if(k==='p'||k==='a'){const l=S[k],n=k==='p'?'Pistolas':'Armaduras';
      h+=`<div class="item">${ICON[k]}<div><div class="t">${n} · nivel ${l}</div><div class="d">+30 % ${k==='p'?'ataque':'defensa'} de cada soldado.</div>${pip(l)}</div>
      <button class="buy" data-buy="${k}" ${l>=5||M<upPrice(l)?'disabled':''}>${l>=5?'Máx.':upPrice(l)+' €'}</button></div>`}
    else h+=`<div class="item">${ICON[k]}<div><div class="t">${U[k].n} · tienes ${S.army[k]}</div><div class="d">${U[k].d}</div></div><button class="buy" data-buy="${k}" ${M<U[k].price?'disabled':''}>${U[k].price} €</button></div>`;
  }
  return h+'</div>';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-diff],[data-skill],[data-gen],[data-bld],[data-wup],[data-dip],[data-evc],[data-race],[data-tc],[data-flyto],[data-zoomreg],[data-pick],[data-region],[data-tab],[data-view],[data-buy],[data-task],[data-act],[data-go],[data-trip],[data-skin],[data-wbuy],[data-tax],[data-rbuy],[data-tac],[data-doct]');
  if(!b||b.disabled)return;
  const d=b.dataset;if(typeof empClick==='function'&&empClick(d))return;
  if(d.tc){ui.tsel=d.tc;countryCities(d.tc);sfx('click');render();const tp=document.getElementById('tpanel');if(tp&&tp.scrollIntoView)tp.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  if(d.flyto){ui.view='viajes';ui.tsel=d.flyto;if(WORLD&&WORLD.lab[d.flyto]){const[x,y]=WORLD.lab[d.flyto];ui.tvb=tvbCenter(x,y,1500)}if(!$('#modal').hidden)closeModal();sfx('click');render();window.scrollTo&&window.scrollTo({top:0,behavior:'smooth'});return}
  if(d.act==='tzin'||d.act==='tzout'){const[x,y,w,h]=ui.tvb,f=d.act==='tzin'?1/1.5:1.5,nw=clamp(w*f,180,3800);ui.tvb=[x+(w-nw)/2,y+(h-nw*9/16)/2,nw,nw*9/16];render();return}
  if(d.act==='tzall'){ui.tvb=[-100,-80,3800,3800*9/16];render();return}
  if(d.act==='tzme'){const hc=cityById(S.loc||'madrid');ui.tvb=tvbCenter((hc.lon+170)*10,(84-hc.lat)*10,1200);render();return}
  if(d.zoomreg){ui.sel=d.zoomreg;zoomTo(d.zoomreg);sfx('click');render();const c=document.querySelector('.rcard');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  if(d.act==='zin'||d.act==='zout'){const[x,y,w,h]=curVB(),f=d.act==='zin'?1/1.5:1.5;ui.vb=clampVB([x+w*(1-f)/2,y+h*(1-f)/2,w*f,h*f]);render();return}
  if(d.act==='zall'){curVB();ui.vb=fitAll();render();return}
  if(d.act==='bigmap'){ui.big=ui.big===false;render();return}
  if(d.act==='ztg'){zoomTargets();render();return}
  if(d.act==='dim'){ui.dim=ui.dim===false;render();return}
  if(d.pick)return newGame(d.pick);
  if(d.trip){const[c,m]=d.trip.split(':');return startTrip(c,m)}
  if(d.skin){const[c,k]=d.skin.split(':');return buySkin(c,k)}
  if(d.wbuy)return buyWeapon(d.wbuy);
  if(d.tax){S.tax=+d.tax;sfx('click');save();render();return}
  if(d.region){ui.sel=d.region;sfx('click');render();return}
  if(d.tab){ui.tab=d.tab;render();return}
  if(d.view){ui.view=d.view;sfx('click');if(!$('#modal').hidden)closeModal();else render();return}
  if(d.buy)return buy(d.buy);
  if(d.task)return startTask(d.task);
  if(d.go)return travel(d.go);
  if(d.act==='end')return endTurn();
  if(d.act==='attack')return planModal(d.id,'q');

function attack3d(id,tac){tac=TACT[tac]?tac:'frontal';

      html=`<div class="result w">¡${R[id].n.toUpperCase()} ES TUYA!</div><p>Tu bandera ondea en ${R[id].n}. Ganas <b>${loot} €</b> de botín y <b>+${R[id].v} €</b> cada turno.</p>${S.newW?`<p>🗡️ Nueva arma regional: <b>${WPN[S.newW].n}</b></p>`:''}${S.world?`<button class="btn" data-act="parade" data-t="Conquista de ${R[id].n}">🎖️ DESFILE DE LA VICTORIA</button>`:''}`}
    else{UK.forEach(k=>{S.armies[id][k]=Math.max(0,(S.armies[id][k]||0)-res.lossD[k])});log(`Derrota en ${R[id].n}. Abatiste ${res.kills} enemigos.`,'bad');campAdd(0,res.lossA,res.lossD);

function defend3d(){

async function loadWorld(){if(WORLD)return WORLD;const r=await fetch('world.json');if(!r.ok)throw new Error('mundo');WORLD=await r.json();return WORLD}
function applyWorld(){const w=WORLD,st=S.world.stage;

function genArmy(id,m){const t=WORLD.tier[id];return{s:Math.round((40+45*t)*m),t:Math.round(2*t*m),h:Math.round(t*.8*m),av:Math.round(Math.max(0,t-1)*.8*m),bq:COAST.has(id)?Math.round(t*.8*m):0}}
async function enterWorld(stage){
  try{await loadWorld()}catch(e){openModal('<h2>No se pudo cargar el mapa</h2><p>Revisa tu conexión y vuelve a intentarlo.</p><button class="btn" data-act="close">VALE</button>');S.over='win';return}
  const first=!S.world;S.world={stage};S.over=null;
  applyWorld();
  const m=(stage==='europa'?1.2:1.8)+S.turn*.03;
  if(first){S.owner={};S.armies={};WORLD.ids.forEach(id=>{S.owner[id]=id});S.owner.ESP='P'}
  IDS.forEach(id=>{if(!mine(id)&&(first||!WORLD.eu.includes(id)))S.armies[id]=genArmy(id,m)});
  S.attacks=2;delete S.pendingCounter;
  log(stage==='europa'?'¡Comienza la conquista de Europa!':'¡Comienza la conquista del mundo!','gold');
  ui.view='map';ui.sel=IDS.find(id=>!mine(id)&&ADJ[id].some(mine))||'ESP';ui.vb=null;if(stage==='mundo')zoomTargets();

  obj.traverse(o=>{if(o.isMesh&&o.material&&o.material.color&&o.material.color.getHex()===base){if(mat)o.material=mat;else o.material=o.material.clone(),o.material.color.setHex(v)}});return obj}

function aspectoHTML(){ensureDefaults();let h='<h2>Aspecto</h2><p class="note">Compra y equipa aspectos para tu ejército, tu caballo, tus vehículos y tu revólver. Se ven en las batallas, en tu región y en los viajes.</p>';
  for(const cat in SKINS){const C=SKINS[cat],cur=S.skin[cat],own=S.skOwn[cat]||[];h+=`<div class="sub">${C.n}</div><div class="skins">`;
    for(const k in C.items){const[n,price,v]=C.items[k],o=price===0||own.includes(k);h+=`<div class="skin ${cur===k?'on':''}">${swatch(cat,k,v)}<b>${n}</b>${cur===k?'<small>Equipado</small>':`<button class="buy" data-skin="${cat}:${k}" ${!o&&S.money<price?'disabled':''}>${o?'Equipar':price+' €'}</button>`}</div>`}h+='</div>'}return h}
function buySkin(cat,k){ensureDefaults();const[n,price]=SKINS[cat].items[k];S.skOwn[cat]=S.skOwn[cat]||[];if(price>0&&!S.skOwn[cat].includes(k)){if(S.money<price)return;S.money-=price;S.skOwn[cat].push(k);log(`Aspecto comprado: ${n}.`,'gold')}
  S.skin[cat]=k;save();sfx('coin');if(G3){if(cat==='horse'){G3.scene.remove(G3.horse);G3.horse=makeHorse(horseOpts());G3.scene.add(G3.horse)}if(cat==='veh')G3.armySig=''}render()}
